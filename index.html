<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pikalbo</title>
<style>
:root{--bg:#f4f7ee;--card:#fff;--ink:#16210f;--mute:#6b7a5c;--acc:#a4d600;--acc2:#00b894;--line:#dfe8d0;--glow:rgba(164,214,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d140a;--card:#172112;--ink:#eef6e2;--mute:#92a582;--line:#26361d;--glow:rgba(190,255,0,.3)}}
:root[data-theme="dark"]{--bg:#0d140a;--card:#172112;--ink:#eef6e2;--mute:#92a582;--line:#26361d;--glow:rgba(190,255,0,.3)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 20% 20%,var(--glow),transparent 40%),radial-gradient(circle at 80% 70%,rgba(0,184,148,.25),transparent 40%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg) scale(1.1)}}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{margin:6px 0 2px;font-size:clamp(28px,7vw,44px);letter-spacing:-1px;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;backdrop-filter:blur(8px)}
.tabs button{flex:1;position:relative;z-index:1;border:0;background:none;color:var(--mute);font:600 12.5px inherit;padding:10px 2px;border-radius:12px;cursor:pointer;transition:color .3s}
.tabs button.on{color:#102000}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:12px;background:linear-gradient(135deg,var(--acc),#d6ff4d);box-shadow:0 4px 18px var(--glow);transition:transform .55s cubic-bezier(.7,-.4,.2,1.4)}
.view{animation:enter .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{opacity:0;transform:perspective(900px) rotateX(-12deg) translateY(28px) scale(.96)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;transition:transform .35s,box-shadow .35s}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px var(--glow)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 14px inherit;cursor:pointer;color:#102000;background:linear-gradient(135deg,var(--acc),#d6ff4d);transition:transform .2s,box-shadow .2s,filter .2s}
@media (hover:hover){.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px var(--glow)}}.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{filter:grayscale(1);opacity:.45;pointer-events:none}
.emo{display:flex;gap:4px;flex-wrap:wrap}.emo span{font-size:22px;padding:4px;border-radius:10px;cursor:pointer;transition:transform .25s cubic-bezier(.3,2,.5,1);border:2px solid transparent}
.emo span:hover{transform:scale(1.35) rotate(-8deg)}.emo span.sel{border-color:var(--acc);background:var(--glow)}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;background:var(--bg);background-size:cover;background-position:center;border:3px solid var(--acc);overflow:hidden}
.av.sm{width:38px;height:38px;font-size:20px;border-width:2px}.av.lg{width:84px;height:84px;font-size:46px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px;position:relative;animation:pop .5s cubic-bezier(.2,2,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-15deg)}}
.pl .av{transition:transform .5s}.pl:hover .av{transform:rotateY(360deg) scale(1.1)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:none;color:var(--mute);font:700 13px inherit;padding:7px 10px;border-radius:9px;cursor:pointer;transition:all .35s cubic-bezier(.3,1.6,.5,1)}.seg button.on{background:var(--acc);color:#102000;box-shadow:0 3px 12px var(--glow);transform:scale(1.06)}
.players.v-list{grid-template-columns:1fr}.v-list .pl{flex-direction:row;text-align:left;padding:8px 12px;gap:12px;margin-bottom:0}.v-list .pl .av.lg{width:44px;height:44px;font-size:24px}.v-list .pl b{flex:1;min-width:0}.v-list .x{position:static;order:3;font-size:18px;padding:6px}
.players.v-wall{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.v-wall .pl{padding:0;aspect-ratio:1;justify-content:flex-end;overflow:hidden}.v-wall .pl .av.lg{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;border:0;font-size:64px}.v-wall .pl:hover .av{transform:scale(1.1)}.v-wall .pl b{position:relative;z-index:1;width:100%;padding:22px 6px 8px;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}.v-wall .pl label{display:none}.v-wall .x{z-index:2;color:#fff;text-shadow:0 1px 4px #000}
.x{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;animation:flip .7s cubic-bezier(.2,.9,.3,1.1) both;transform-origin:center}
@keyframes flip{from{opacity:0;transform:perspective(800px) rotateY(90deg)}}
.team{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-weight:600;font-size:14px}
.team .pair{display:flex;gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px}
.sc input{width:64px;text-align:center;font-size:22px;font-weight:800;padding:8px 4px}
.vs{font-size:12px;color:var(--mute);font-weight:800}
.win{animation:winner .8s ease both}
@keyframes winner{50%{transform:scale(1.12)}}
.team.w .av{box-shadow:0 0 0 4px var(--glow),0 0 24px var(--acc)}
.court{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.bye{color:var(--mute);font-size:14px}
.lb{position:relative}
.lrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);margin-bottom:6px;border:1px solid var(--line)}
.rk{width:30px;text-align:center;font-weight:800;font-size:18px}
.lrow .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--mute);text-align:right}.st b{color:var(--ink);font-size:16px}
.lrow.first{background:linear-gradient(135deg,rgba(255,200,0,.25),var(--bg));border-color:#e8b800}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 18px;min-height:240px}
.pod{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-weight:700}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:8px;font-size:34px;transform-origin:bottom;animation:rise 1.2s cubic-bezier(.2,1.2,.3,1) both}
.pod:nth-child(1) .blk{height:90px;background:linear-gradient(#cfd8dc,#90a4ae);animation-delay:.5s}
.pod:nth-child(2) .blk{height:130px;background:linear-gradient(#ffe066,#e8b800);animation-delay:.1s}
.pod:nth-child(3) .blk{height:65px;background:linear-gradient(#e0a070,#b06a3b);animation-delay:.9s}
@keyframes rise{from{transform:scaleY(0)}}
.pod .av{animation:drop 1s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.2s}
@keyframes drop{from{opacity:0;transform:translateY(-120px) scale(.4)}}
.trophy{font-size:58px;display:block;text-align:center;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 14px var(--glow))}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);animation:pop .6s both}
.glowb{position:relative;border:0}
.glowb::before{content:"";position:absolute;inset:-2px;border-radius:22px;z-index:-1;background:conic-gradient(from var(--a,0deg),var(--acc),var(--acc2),#ffd700,var(--acc));animation:spin 4s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:6px 0;flex:1;min-width:0}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}.ic:hover{transform:rotate(120deg)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .5s;z-index:60;backdrop-filter:blur(3px)}.sopen #scrim{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:61;background:var(--card);border-left:1px solid var(--line);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;transform:translateX(108%) skewX(-6deg);transition:transform .7s cubic-bezier(.2,1,.3,1)}.sopen #drawer{transform:none}
#drawer h4{margin:20px 0 8px;color:var(--mute);font-size:12px;letter-spacing:1px;text-transform:uppercase}.dh{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.sw small{display:block;color:var(--mute);font-size:12px}.sw input{display:none}.sw i{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .35s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .5s cubic-bezier(.3,1.8,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{transform:translateX(18px)}
.calm *,.calm body::before{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
#landing{position:fixed;inset:0;z-index:70;overflow:auto;background:var(--bg);clip-path:circle(0% at 50% 38%);pointer-events:none;transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}.lopen #landing{clip-path:circle(150% at 50% 38%);pointer-events:auto}
.lw{max-width:760px;margin:0 auto;padding:max(30px,env(safe-area-inset-top)) 18px 24px;text-align:center}.tag{color:var(--mute);max-width:480px;margin:10px auto}.btn.big{padding:15px 32px;font-size:17px;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px transparent,0 8px 30px var(--glow)}}
.ballw{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.ball{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 30% 34%,rgba(0,0,0,.28) 0 5px,transparent 6px),radial-gradient(circle at 62% 30%,rgba(0,0,0,.28) 0 5px,transparent 6px),radial-gradient(circle at 48% 58%,rgba(0,0,0,.28) 0 5px,transparent 6px),radial-gradient(circle at 74% 62%,rgba(0,0,0,.28) 0 5px,transparent 6px),radial-gradient(circle at 26% 70%,rgba(0,0,0,.28) 0 5px,transparent 6px),radial-gradient(circle at 35% 28%,#f2ff8c,#a4d600 60%,#6f9400);box-shadow:inset -8px -10px 18px rgba(0,0,0,.2);animation:bnc 1.3s cubic-bezier(.35,0,.65,1) infinite}@keyframes bnc{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-58px) rotate(200deg)}}
.shd{width:80px;height:10px;border-radius:50%;background:rgba(0,0,0,.2);margin-top:6px;animation:shd 1.3s cubic-bezier(.35,0,.65,1) infinite}@keyframes shd{50%{transform:scale(.6);opacity:.4}}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.f{animation:pop .8s both;text-align:center}.f span{font-size:36px;display:block}.f p{margin:4px 0 0;color:var(--mute);font-size:14px}.steps{color:var(--mute);font-size:13px;margin:18px 0}
.mgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}.mgrid select,.mgrid input{width:100%;margin-top:6px}.mgrid .vs{align-self:center;padding-top:20px}.x2{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;padding:6px}.mg{animation:pop .5s both}
.ls{text-align:left;margin-top:14px}.ls>b{display:block;margin-bottom:6px}.lm{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.lm:last-of-type{border:0}.lm .court{display:block;margin:0 0 2px}.menu{justify-content:center;margin:0 0 4px}
.mx{border-collapse:collapse;font-size:12px;width:100%}.mx th,.mx td{padding:6px;border:1px solid var(--line);text-align:center;white-space:nowrap}.mx th{background:var(--bg)}.mw{color:#00a86b;font-weight:800}.ml{color:#d63031;font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gc{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);animation:pop .55s cubic-bezier(.2,2,.4,1) both;transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.gc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,1,.3,1)}
@media (hover:hover){.gc:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 28px var(--glow)}.gc:hover img{transform:scale(1.12)}}
.gc span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lbx{position:fixed;inset:0;z-index:80;background:rgba(5,10,3,.92);backdrop-filter:blur(10px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));overflow:auto}#lbx.on{opacity:1;pointer-events:auto}
.lbc{display:flex;flex-direction:column;gap:10px;align-items:center;width:min(640px,100%)}.lbi{max-width:100%;max-height:56vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:lbin .6s cubic-bezier(.2,1,.3,1)}@keyframes lbin{from{opacity:0;transform:scale(.8) rotate(-4deg)}}.lbc input{width:100%;text-align:center}
.sh{margin:0 0 14px}.sh .btn{padding:8px 12px}.sh .wa{border-color:#25d366}.sh .ms{border-color:#0084ff}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,160%) scale(.8);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:90;transition:transform .6s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer}#toast.on{transform:translate(-50%,0) scale(1)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px 0 8px}
label.btn{display:inline-block;position:relative;overflow:hidden}.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* professional pass */
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button{display:inline-flex;align-items:center;gap:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:8px 2px;letter-spacing:.2px}.tabs .i{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#d6ff4d);color:#102000;flex:none;box-shadow:0 4px 14px var(--glow)}.logo .i{width:24px;height:24px}
.brand h1{margin:0;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.5px}
.ic{display:grid;place-items:center}.ic .i{width:20px;height:20px;vertical-align:middle}.ic:hover{transform:none;border-color:var(--acc)}
.x .i,.x2 .i{width:16px;height:16px;vertical-align:middle}
.card{border-radius:16px;padding:16px}
.glowb::before{display:none}.glowb{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
@media (hover:hover){.card:hover{transform:none;box-shadow:0 6px 20px var(--glow)}}
.card>b:first-child,.ls>b,.dh+h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card);border:1px solid var(--line);flex:none}
.rk.r1{background:#f5c518;color:#3a2c00;border-color:#d9a900}.rk.r2{background:#cfd8dc;color:#263238;border-color:#9eaab0}.rk.r3{background:#d99a6c;color:#3b1f08;border-color:#b57546}
.trophy{display:block;text-align:center}.trophy .i{width:64px;height:64px;color:#e8b800;stroke-width:1.5}
.pod .blk{font-size:30px;font-weight:800;color:rgba(0,0,0,.55)}
.f>span{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--bg);margin:0 auto 8px;color:var(--acc2);font-size:15px}.f>span .i{width:24px;height:24px}
.badge{display:inline-flex;align-items:center;gap:6px}
.sh .bye{display:inline-flex;align-items:center;gap:6px}
.av{font-weight:800;font-size:20px;letter-spacing:.5px}.av.sm{font-size:14px}.av.lg{font-size:30px}.av .i{width:55%;height:55%;color:var(--mute)}.v-wall .pl .av.lg{font-size:40px}

.wz{max-width:520px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px 24px;text-align:left}.wz h2{font-size:26px;margin:6px 0 4px}.wz .brand h1{font-size:26px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 18px}.dot{width:34px;height:6px;border-radius:99px;background:var(--line);transition:background .4s}.dot.on{background:var(--acc)}
.wz textarea{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:17px;resize:vertical;margin-top:8px}.wz textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.q{display:block;margin:16px 0 8px}.opts{display:flex;gap:10px}
.opt{flex:1;padding:16px 0;font:800 22px inherit;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:all .3s}.opt.on{border-color:var(--acc);background:var(--glow);transform:scale(1.04)}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;margin-bottom:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;transition:all .3s}.choice.on{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice .ci{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--acc2);flex:none}.choice .ci .i{width:24px;height:24px}
.choice small{display:block;color:var(--mute);font-size:13px;margin-top:2px}.choice em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--acc);color:#102000;border-radius:99px;padding:2px 8px;margin-left:8px}

document.querySelectorAll("[data-tm]").forEach(s=>s.onchange=()=>{const[i,k]=s.dataset.tm.split(":").map(Number),v=s.value||null,old=S.teams[i][k];if(v)S.teams.forEach((t,a)=>t.forEach((x,b)=>{if(x===v)S.teams[a][b]=old}));S.teams[i][k]=v;snd("tap");render(true)});
document.querySelectorAll("[data-shuf]").forEach(b=>b.onclick=()=>{const a=S.players.map(p=>p.id).sort(()=>Math.random()-.5);S.teams=[];for(let i=0;i<a.length;i+=2)S.teams.push([a[i],a[i+1]||null]);snd("pop");render(true)});
document.querySelectorAll("[data-paste]").forEach(b=>b.onclick=pasteImg);
document.querySelectorAll("[data-shg]").forEach(b=>b.onclick=()=>openShare("photo",[]));
document.querySelectorAll("[data-gi]").forEach(c=>c.onclick=()=>openLb(+c.dataset.gi));
document.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{const k=b.dataset.sh.split(":")[1];openShare(k)});
q("#fin2",()=>{S.finished=true;snd("fan");render(true);if(S.set.confetti)confetti()});
q("#cfg",()=>openSet(true));q("#nxt",()=>{snd("next");nextRound();render()});q("#all",()=>{S.showAll=!S.showAll;render()});
q("#fin",()=>{S.finished=true;tab="board";snd("fan");render(true);if(S.set.confetti)confetti()});
q("#reset",()=>{const b=$("#reset");if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Tap again to confirm reset";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Reset tournament"}},3000);return}S.started=false;S.finished=false;S.rounds=[];render(true)});
if(tab==="board")flip()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render(true)});
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#a4d600","#ffd700","#00b894","#ff7675","#74b9ff","#fd79a8"];
const ps=Array.from({length:180},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*7+3,c:cols[Math.random()*6|0],a:Math.random()*6,s:(Math.random()-.5)*.4}));let f=0;
(function t(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<240)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener("click",e=>{if(e.target.closest("button,label.btn,.emo span"))snd("tap")});
$("#gear").onclick=()=>openSet(true);$("#scrim").onclick=()=>openSet(false);$("#home").onclick=$("#back").onclick=()=>{snd("pop");showLand(true)};
applySet();showLand(true);render();
</script></body></html>
